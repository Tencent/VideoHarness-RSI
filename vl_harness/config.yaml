# Identical to config_k40.yaml. Kept so older scripts that hardcode this
# filename still run the paper protocol (K=40, val 350 / test 882).
# Prefer VL_HARNESS_CONFIG=config_k40.yaml.
run:
  name: paper-k40
  iterations: 5
  skip_baseline: false
  fresh: false
video:
  target_side: 640
  frame_budget: 40
dataset:
  num_train: 10
  num_val: 40
  num_test: 40
  overrides:
    mlvu:
      num_train: 0
      num_val: 8
      num_test: 0
    video_mme:
      num_train: 0
      num_val: 0
      num_test: 2700
    mvbench:
      num_train: 0
      num_val: 0
      num_test: 4000
    lvbench:
      num_train: 0
      num_val: 350
      num_test: 882
inner_loop:
  mode: offline
  num_epochs: 1
  temperature: 0.0
  max_tokens: 8192
  enable_thinking: false
  vlm_timeout: 7200
  max_workers: 8
  eval_interval: 0
  batch_size: 1
  seed: 42
evolution:
  candidate_concurrency: 4
search_space: full
models:
- model: Qwen3-VL-8B-Instruct
  api_base: http://127.0.0.1:8080/v1
embedder:
  backend: real
  model: clip-ViT-B-32
  api_base: http://127.0.0.1:8181
  timeout: 7200
  dim: 512
benchmark:
  seeds:
  - 42
  concurrency: 2
datasets:
- lvbench
memory_systems:
  baselines:
  - pilot_uniform_k
  - aks
  include_paper_prompt_seed: false
  proposed: []
