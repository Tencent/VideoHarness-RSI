# Main paper protocol (default via setenv / meta_harness).
# K=40, LVBench 0/350/882, seed 42, temperature 0.
# Do not change the LVBench split without renaming the run — that is a
# different experiment from the numbers in README.md.
# Generic config.yaml uses the legacy 200/1032 split (Appendix G).
run:
  name: paper-k40
  iterations: 5
  skip_baseline: false
  fresh: false
video:
  target_side: 640
  frame_budget: 40
dataset:
  num_train: 10
  num_val: 40
  num_test: 40
  overrides:
    mlvu:
      num_train: 0
      num_val: 8
      num_test: 0
    video_mme:
      num_train: 0
      num_val: 0
      num_test: 2700
    mvbench:
      num_train: 0
      num_val: 0
      num_test: 4000
    lvbench:
      num_train: 0
      num_val: 350
      num_test: 882
inner_loop:
  mode: offline
  num_epochs: 1
  temperature: 0.0
  max_tokens: 8192
  enable_thinking: false
  vlm_timeout: 7200
  max_workers: 8
  eval_interval: 0
  batch_size: 1
  seed: 42
evolution:
  candidate_concurrency: 4
search_space: full
models:
- model: Qwen3-VL-8B-Instruct
  api_base: http://127.0.0.1:8080/v1
embedder:
  backend: real
  model: clip-ViT-B-32
  api_base: http://127.0.0.1:8181
  timeout: 7200
  dim: 512
benchmark:
  seeds:
  - 42
  concurrency: 2
datasets:
- lvbench
memory_systems:
  baselines:
  - pilot_uniform_k
  # - aks
  include_paper_prompt_seed: false
  proposed: []
